# Whole system in one command:   cp .env.example .env   (fill it in)   then   docker compose up --build
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DEMO_MODE: ${DEMO_MODE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (a long random string)}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEOCODER_EMAIL: ${GEOCODER_EMAIL:-}
      # Origins allowed to call the API. Defaults cover http://localhost on any port.
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
    volumes:
      - backend-data:/data # SQLite database and uploaded rider documents
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Where browsers reach the API (compiled into the frontend at build time).
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  backend-data:
